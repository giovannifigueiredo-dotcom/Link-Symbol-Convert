<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiar Imagem por Link</title>
<style>
  /* Reset básico e configurações de fonte */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Animação do Fundo da Página */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(-45deg, #1e3c72, #2a5298, #00d2ff, #3a7bd5);
    background-size: 400% 400%;
    animation: gradientBackground 12s ease infinite;
    color: #fff;
  }

  @keyframes gradientBackground {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Container Principal Centralizado (Efeito Glassmorphism) */
  .container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    animation: fadeIn 1s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Título e Descrição */
  h1 {
    font-size: 24px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  p {
    font-size: 14px;
    margin-bottom: 25px;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.5;
  }

  /* Caixa de Link com Animação de Foco */
  .link-input {
    width: 100%;
    padding: 12px 15px;
    font-size: 14px;
    border: 2px solid transparent;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    outline: none;
    transition: all 0.3s ease;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }

  .link-input:focus {
    border-color: #00d2ff;
    transform: scale(1.02);
    background: #fff;
    box-shadow: 0 6px 12px rgba(0, 210, 255, 0.3);
  }

  /* Botão com Animações de Hover e Pulso */
  .copy-btn {
    background-color: #00d2ff;
    background-image: linear-gradient(to right, #00d2ff 0%, #3a7bd5 100%);
    border: none;
    color: white;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  .copy-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
    background-image: linear-gradient(to right, #3a7bd5 0%, #00d2ff 100%);
  }

  .copy-btn:active {
    transform: translateY(1px);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Copiador de Imagens</h1>
    <p>Insira o link direto de uma imagem na caixa abaixo. Ao clicar no botão, a imagem será baixada e copiada diretamente para a sua área de transferência.</p>
    
    <input type="text" id="imageLink" class="link-input" placeholder="Cole o link da imagem aqui" value="image_1593e6.png">
    
    <button class="copy-btn" onclick="copyImage()">Copiar Imagem</button>
  </div>

<script>
async function copyImage() {
  const imageUrl = document.getElementById("imageLink").value;
  const btn = document.querySelector(".copy-btn");
  const originalText = btn.innerText;

  try {
    // Feedback visual de carregamento
    btn.innerText = "Copiando...";
    btn.style.pointerEvents = "none";

    // Faz o download da imagem a partir do link
    const response = await fetch(imageUrl);
    
    if (!response.ok) throw new Error("Erro na rede ou CORS.");
    
    const blob = await response.blob();

    // Cria o item para a área de transferência
    const item = new ClipboardItem({ [blob.type]: blob });

    // Copia a imagem para a área de transferência
    await navigator.clipboard.write([item]);

    // Feedback visual de sucesso
    btn.innerText = "Copiado com Sucesso! ✔";
    btn.style.backgroundImage = "linear-gradient(to right, #11998e 0%, #38ef7d 100%)";
    
    setTimeout(() => {
      btn.innerText = originalText;
      btn.style.backgroundImage = "linear-gradient(to right, #00d2ff 0%, #3a7bd5 100%)";
      btn.style.pointerEvents = "auto";
    }, 3000);

  } catch (error) {
    console.error("Erro ao copiar:", error);
    alert("Não foi possível copiar a imagem. Verifique se o link está correto ou se o servidor permite o acesso (bloqueio de CORS).");
    btn.innerText = originalText;
    btn.style.pointerEvents = "auto";
  }
}
</script>

</body>
</html>
