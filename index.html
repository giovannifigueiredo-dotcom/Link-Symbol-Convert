<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiar Imagem por Link</title>
<style>
  /* Reset básico e configurações de fonte */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Animação do Fundo da Página */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(-45deg, #1e3c72, #2a5298, #00d2ff, #3a7bd5);
    background-size: 400% 400%;
    animation: gradientBackground 12s ease infinite;
    color: #fff;
  }

  @keyframes gradientBackground {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Container Principal Centralizado (Efeito Glassmorphism) */
  .container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    animation: fadeIn 1s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Título e Descrição */
  h1 {
    font-size: 24px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  p {
    font-size: 14px;
    margin-bottom: 25px;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.5;
  }

  /* Caixa de Link com Animação de Foco */
  .link-input {
    width: 100%;
    padding: 12px 15px;
    font-size: 14px;
    border: 2px solid transparent;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    outline: none;
    transition: all 0.3s ease;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }

  .link-input:focus {
    border-color: #00d2ff;
    transform: scale(1.02);
    background: #fff;
    box-shadow: 0 6px 12px rgba(0, 210, 255, 0.3);
  }

  /* Botão com Animações de Hover e Pulso */
  .copy-btn {
    background-color: #00d2ff;
    background-image: linear-gradient(to right, #00d2ff 0%, #3a7bd5 100%);
    border: none;
    color: white;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  .copy-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
    background-image: linear-gradient(to right, #3a7bd5 0%, #00d2ff 100%);
  }

  .copy-btn:active {
    transform: translateY(1px);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
  }

  /* Estilos para o Upload de Arquivo */
  .file-upload-wrapper {
    margin-bottom: 10px;
  }
  
  .file-upload-label {
    display: block;
    background: rgba(255, 255, 255, 0.15);
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    border: 1px dashed rgba(255, 255, 255, 0.5);
    transition: all 0.3s ease;
    text-align: center;
  }
  
  .file-upload-label:hover {
    background: rgba(255, 255, 255, 0.25);
    border-color: #00d2ff;
  }
  
  input[type="file"] {
    display: none;
  }
  
  .divider {
    margin: 15px 0;
    font-size: 12px;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Copiador de Links de Imagens</h1>
    <p>Insira o link direto de uma imagem na caixa abaixo ou envie uma imagem do seu dispositivo para convertê-la em link. Ao clicar no botão, o link (texto ou string Base64) será copiado para a sua área de transferência.</p>
    
    <!-- Novo campo de Upload -->
    <div class="file-upload-wrapper">
      <label for="imageUpload" class="file-upload-label" id="uploadLabel">📁 Escolher imagem do dispositivo...</label>
      <input type="file" id="imageUpload" accept="image/*">
    </div>
    
    <div class="divider">ou</div>

    <input type="text" id="imageLink" class="link-input" placeholder="Cole o link da imagem aqui ou gere um acima" value="image_1593e6.png">
    
    <button class="copy-btn" onclick="copyLink()">Copiar Link</button>
  </div>

<script>
// Nova lógica para converter imagem local em link Base64
document.getElementById('imageUpload').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const label = document.getElementById('uploadLabel');
    label.innerText = `⏳ Convertendo ${file.name}...`;
    
    const reader = new FileReader();
    
    reader.onload = function(event) {
      // O resultado é um Data URL (Base64) que serve como link da imagem
      const base64String = event.target.result;
      document.getElementById('imageLink').value = base64String;
      label.innerText = `✅ ${file.name} (Pronto!)`;
    };
    
    reader.onerror = function() {
      label.innerText = "❌ Erro ao ler a imagem";
    };
    
    reader.readAsDataURL(file);
  }
});

async function copyLink() {
  const linkText = document.getElementById("imageLink").value;
  const btn = document.querySelector(".copy-btn");
  const originalText = "Copiar Link";

  try {
    // Feedback visual de carregamento
    btn.innerText = "Copiando...";
    btn.style.pointerEvents = "none";

    // Copia apenas o TEXTO (link ou Base64) para a área de transferência
    await navigator.clipboard.writeText(linkText);

    // Feedback visual de sucesso
    btn.innerText = "Link Copiado! ✔";
    btn.style.backgroundImage = "linear-gradient(to right, #11998e 0%, #38ef7d 100%)";
    
    setTimeout(() => {
      btn.innerText = originalText;
      btn.style.backgroundImage = "linear-gradient(to right, #00d2ff 0%, #3a7bd5 100%)";
      btn.style.pointerEvents = "auto";
    }, 3000);

  } catch (error) {
    console.error("Erro ao copiar:", error);
    alert("Não foi possível copiar o texto.");
    btn.innerText = originalText;
    btn.style.pointerEvents = "auto";
  }
}
</script>

</body>
</html>
